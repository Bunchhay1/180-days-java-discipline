spring.application.name=mini-titan-api
spring.datasource.url=jdbc:postgresql://localhost:5432/titandb
spring.datasource.username=postgres
spring.datasource.password=secretpassword

# Hibernate properties (Auto-create tables on our Entity classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# h2 Console (Allows us to view the database in browser )
spring.h2.console.enabled=false
