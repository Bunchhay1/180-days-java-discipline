server:  port: 8080spring:  application:    name: titan-bank-api  datasource:    # ប្តូរពី 192.168.0.120 មកជា localhost    url: jdbc:postgresql://localhost:5432/codingdb    username: postgres    password: postgres  jpa:    hibernate:      ddl-auto: update    show-sql: true    eureka:      client:        serviceUrl:          defaultZone: http:localhost:8761/eureka/resilience4j:  circuitbreaker:    instances:      notificationService:        registerHealthIndicator: true        slidingWindowSize: 10   # last request 10        failureRateThreshold: 50 # lost 5 time disconnect        waitDurationInOpenState: 10000  # disconnect 10m then try it out        permittedNumberOfCallsHalfOpenState: 3